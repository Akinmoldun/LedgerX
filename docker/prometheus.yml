global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ledgerx-app"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: ledgerx

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
