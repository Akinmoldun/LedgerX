# fly.toml app configuration file for LedgerX
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'ledgerx'
primary_region = 'lhr'

[env]
  PORT = '8080'
  SPRING_PROFILES_ACTIVE = 'prod'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '60s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/actuator/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
